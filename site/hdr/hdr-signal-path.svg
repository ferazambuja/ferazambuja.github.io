<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1040" viewBox="0 0 1260 1040"><rect width="1260" height="1040" fill="white" /><text x="54" y="67" font-family="'Times New Roman', Georgia, serif" font-size="31" font-weight="700" fill="#0F172A" text-anchor="start">End-to-End HDR Signal Path</text><text x="54" y="96" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">From authored stimulus intent to validated HDR output and measurement traceability.</text><rect x="60" y="130" width="1140" height="56" rx="15" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8" /><text x="630.0" y="168.5" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">Requested Stimulus State</text><rect x="60" y="482" width="735" height="56" rx="15" fill="#DCFCE7" stroke="#059669" stroke-width="1.8" /><text x="427.5" y="520.5" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">Realized Renderer State</text><rect x="870" y="482" width="330" height="56" rx="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8" /><text x="1035.0" y="520.5" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">Measured Output</text><rect x="60" y="212" width="330" height="162" rx="18.0" fill="#F8FBFF" stroke="#2563EB" stroke-width="2.0" /><text x="82" y="251" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start">1. Study / Stimulus</text><text x="82" y="279" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Template or study records</text><text x="82" y="302" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Requested luminance (cd/m²)</text><text x="82" y="325" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Requested chromaticity (CIE xy)</text><text x="82" y="348" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Geometry, timing, and trial identity</text><rect x="465" y="212" width="330" height="162" rx="18.0" fill="#F8FBFF" stroke="#2563EB" stroke-width="2.0" /><text x="487" y="251" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start">2. Working-Space Prep</text><text x="487" y="279" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">DisplayP3Color and EDRConverter</text><text x="487" y="302" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Normalize Display P3 ratios</text><text x="487" y="325" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Compute the profile-aware EDR scalar</text><rect x="870" y="212" width="330" height="162" rx="18.0" fill="#F8FBFF" stroke="#2563EB" stroke-width="2.0" /><text x="892" y="251" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start">3. CPU Uniform Contract</text><text x="892" y="279" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">UniformAssembler</text><text x="892" y="302" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Pack normalized color separately from</text><text x="892" y="325" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">luminance</text><text x="892" y="348" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Preserve the chroma/luminance split</text><rect x="60" y="564" width="330" height="162" rx="18.0" fill="#F6FFF9" stroke="#059669" stroke-width="2.0" /><text x="82" y="603" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start">4. HDR Surface Contract</text><text x="82" y="631" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">MetalView to configurator hand-off</text><text x="82" y="654" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">pixelFormat plus colorSpace</text><text x="82" y="677" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">dynamicRange, headroom, and</text><text x="82" y="700" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">toneMapMode</text><rect x="465" y="564" width="330" height="179" rx="18.0" fill="#F6FFF9" stroke="#059669" stroke-width="2.0" /><text x="487" y="603" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start">5. GPU Composition</text><text x="487" y="631" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Shaders.metal</text><text x="487" y="654" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Multiply color by luminance</text><text x="487" y="677" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Compose on the extended</text><text x="487" y="700" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">LinearDisplayP3 surface</text><text x="487" y="723" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Validate after configuration</text><rect x="870" y="564" width="330" height="162" rx="18.0" fill="#FFFDF5" stroke="#D97706" stroke-width="2.0" /><text x="892" y="603" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start">6. Display / Meter</text><text x="892" y="631" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Realized display output</text><text x="892" y="654" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Capability snapshot plus warnings</text><text x="892" y="677" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">CR-250 luminance and chromaticity</text><text x="892" y="700" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Run-linked measurement record</text><line x1="390" y1="293.0" x2="447" y2="293.0" stroke="#475569" stroke-width="1.8" stroke-linecap="round" /><polygon points="447,293.0 435,287.0 435,299.0" fill="#475569" /><line x1="795" y1="293.0" x2="852" y2="293.0" stroke="#475569" stroke-width="1.8" stroke-linecap="round" /><polygon points="852,293.0 840,287.0 840,299.0" fill="#475569" /><line x1="390" y1="645.0" x2="447" y2="653.5" stroke="#475569" stroke-width="1.8" stroke-linecap="round" /><polygon points="447,653.5 435,647.5 435,659.5" fill="#475569" /><line x1="795" y1="653.5" x2="852" y2="645.0" stroke="#475569" stroke-width="1.8" stroke-linecap="round" /><polygon points="852,645.0 840,639.0 840,651.0" fill="#475569" /><line x1="1035.0" y1="374" x2="1035.0" y2="466" stroke="#475569" stroke-width="1.8" stroke-linecap="round" /><line x1="1035.0" y1="466" x2="225.0" y2="466" stroke="#475569" stroke-width="1.8" stroke-linecap="round" /><line x1="225.0" y1="466" x2="225.0" y2="548" stroke="#475569" stroke-width="1.8" stroke-linecap="round" /><polygon points="225.0,548 219.0,536 231.0,536" fill="#475569" /><rect x="60" y="791" width="360" height="133" rx="18.0" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" /><text x="82" y="830" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start">Invariant</text><text x="82" y="858" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Chromaticity ratios remain separate from</text><text x="82" y="881" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">luminance magnitude until the final GPU</text><text x="82" y="904" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">composition stage.</text><rect x="457" y="791" width="743" height="118" rx="18.0" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" /><text x="479" y="830" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start">Audit Layers</text><text x="479" y="858" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">ColorSpaceValidator chooses the working space, while ValidationService and</text><text x="479" y="881" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">MetalLayerValidator record surface state before formal execution.</text></svg>