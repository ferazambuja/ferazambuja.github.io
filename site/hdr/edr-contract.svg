<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="940" viewBox="0 0 1260 940"><rect width="1260" height="940" fill="white" /><text x="48" y="67" font-family="'Times New Roman', Georgia, serif" font-size="31" font-weight="700" fill="#0F172A" text-anchor="start">Five-Field EDR Contract and Reference-Mode Summary</text><text x="48" y="96" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">The HDR surface path is a coordinated contract rather than a single HDR switch.</text><rect x="50" y="136" width="140" height="78" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" /><text x="66" y="175" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Field</text><rect x="190" y="136" width="198" height="78" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" /><text x="206" y="175" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">HDR path</text><rect x="388" y="136" width="150" height="78" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" /><text x="404" y="175" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Fallback</text><rect x="538" y="136" width="322" height="78" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" /><text x="554" y="175" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Why it matters</text><rect x="50" y="214" width="140" height="72" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0" /><text x="66" y="246" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">pixelFormat</text><rect x="190" y="214" width="198" height="72" fill="#F0FDF4" stroke="#CBD5E1" stroke-width="1.0" /><text x="206" y="246" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">rgba16Float</text><rect x="388" y="214" width="150" height="72" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.0" /><text x="404" y="246" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">bgra10_xr</text><rect x="538" y="214" width="322" height="72" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0" /><text x="554" y="246" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">Keeps component values above 1.0 in a</text><text x="554" y="269" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">linear surface.</text><rect x="50" y="286" width="140" height="72" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0" /><text x="66" y="318" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">colorSpace</text><rect x="190" y="286" width="198" height="72" fill="#F0FDF4" stroke="#CBD5E1" stroke-width="1.0" /><text x="206" y="318" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">extendedLinear</text><text x="206" y="341" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">DisplayP3</text><rect x="388" y="286" width="150" height="72" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.0" /><text x="404" y="318" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">displayP3</text><rect x="538" y="286" width="322" height="72" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0" /><text x="554" y="318" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">Preserves Display P3 primaries with</text><text x="554" y="341" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">explicit working-space selection.</text><rect x="50" y="358" width="140" height="90" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0" /><text x="66" y="390" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">preferred</text><text x="66" y="413" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">Dynamic</text><text x="66" y="436" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">Range</text><rect x="190" y="358" width="198" height="90" fill="#F0FDF4" stroke="#CBD5E1" stroke-width="1.0" /><text x="206" y="390" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">.high</text><rect x="388" y="358" width="150" height="90" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.0" /><text x="404" y="390" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">.standard</text><rect x="538" y="358" width="322" height="90" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0" /><text x="554" y="390" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">Signals compositor intent, but does not</text><text x="554" y="413" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">activate EDR alone.</text><rect x="50" y="448" width="140" height="72" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0" /><text x="66" y="480" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">contents</text><text x="66" y="503" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">Headroom</text><rect x="190" y="448" width="198" height="72" fill="#F0FDF4" stroke="#CBD5E1" stroke-width="1.0" /><text x="206" y="480" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">&gt; 1.0 (potential</text><text x="206" y="503" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">headroom)</text><rect x="388" y="448" width="150" height="72" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.0" /><text x="404" y="480" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">1.0</text><rect x="538" y="448" width="322" height="72" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0" /><text x="554" y="480" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">Reserves extended-range resources; 1.0</text><text x="554" y="503" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">still means SDR only.</text><rect x="50" y="520" width="140" height="72" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0" /><text x="66" y="552" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">toneMapMode</text><rect x="190" y="520" width="198" height="72" fill="#F0FDF4" stroke="#CBD5E1" stroke-width="1.0" /><text x="206" y="552" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">.never</text><rect x="388" y="520" width="150" height="72" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.0" /><text x="404" y="552" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">.automatic</text><rect x="538" y="520" width="322" height="72" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.0" /><text x="554" y="552" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">Avoids hidden OS tone mapping on the</text><text x="554" y="575" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start">HDR psychophysics path.</text><rect x="908" y="146" width="300" height="202" rx="18.0" fill="#FFFDF5" stroke="#D97706" stroke-width="1.8" /><text x="930" y="185" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start">Headroom Roles</text><text x="930" y="213" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Potential reserves resources for</text><text x="930" y="236" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">contentsHeadroom and HDR</text><text x="930" y="259" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">allocation.</text><text x="930" y="282" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Current is the live realized ceiling.</text><text x="930" y="305" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Reference is the reference-mode</text><text x="930" y="328" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">ceiling when it exists.</text><rect x="908" y="372" width="300" height="148" rx="18.0" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" /><text x="930" y="411" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start">Reference-Mode Handling</text><text x="930" y="439" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">If reference headroom is NaN or 0,</text><text x="930" y="462" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">the platform treats it as unavailable</text><text x="930" y="485" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">and falls back to the potential path.</text><line x1="1058.0" y1="352" x2="1058.0" y2="368" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" /><polygon points="1058.0,368 1052.0,356 1064.0,356" fill="#B45309" /><rect x="908" y="544" width="300" height="179" rx="18.0" fill="#FFF7ED" stroke="#B45309" stroke-width="1.8" /><text x="930" y="583" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start">Two-Phase Initialization</text><text x="930" y="611" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">The first view is created before a</text><text x="930" y="634" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">screen is attached, so</text><text x="930" y="657" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">contentsHeadroom starts at 1.0 and</text><text x="930" y="680" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">is refreshed after window</text><text x="930" y="703" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">attachment.</text><line x1="1058.0" y1="524" x2="1058.0" y2="540" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" /><polygon points="1058.0,540 1052.0,528 1064.0,528" fill="#B45309" /><text x="54" y="774" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Operational split: HDRSurfaceConfigurator writes the contract, MetalLayerValidator checks it, and ValidationService carries the resulting state into run-time warnings and later</text><text x="54" y="795" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">measurement.</text></svg>